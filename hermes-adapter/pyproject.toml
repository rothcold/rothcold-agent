[project]
name = "hermes-rothcold-agent"
version = "0.2.0"
description = "Private loopback messaging adapter for the Hermes gateway"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.14,<3.15"
dependencies = ["aiohttp>=3.14.3,<4"]

[build-system]
requires = ["uv_build==0.13.9"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "rothcold_agent"
module-root = ""
