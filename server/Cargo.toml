[package]
name = "rothcold-agent"
version = "0.2.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[workspace]
members = ["noise-protocol"]

[features]
noise-dev = []

[[example]]
name = "noise-fixture"
path = "../tests/noise_fixture.rs"

[[test]]
name = "noise-v1"
path = "../tests/noise_v1.rs"

[dependencies]
rothcold-noise-protocol = { path = "noise-protocol" }
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio", "json", "ws"] }
tokio = { version = "1", features = ["macros", "rt", "net", "sync", "time", "fs", "io-util"] }
getrandom = "0.4"
ring = "0.17"
curve25519-dalek = "4.1"
rusqlite = "0.37"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
subtle = "2"
rustix = { version = "1.1.4", features = ["fs", "process"] }
libc = "0.2"
sha2 = "0.10"
pulldown-cmark = { version = "0.13", default-features = false }
unicode-segmentation = "1"

[dev-dependencies]
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
tempfile = "3"
tokio-tungstenite = "0.29"
