[package]
name = "rothcold-noise-protocol"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
getrandom = { version = "0.3", features = ["wasm_js"] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
snow = { version = "0.10.0", default-features = false, features = ["use-blake2", "use-chacha20poly1305", "use-curve25519", "use-getrandom"] }
