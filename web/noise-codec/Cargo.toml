[package]
name = "rothcold-web-noise"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
getrandom = "0.3"
rothcold-noise-protocol = { path = "../../server/noise-protocol" }
serde_json = "1"
zeroize = "1"

[profile.release]
codegen-units = 1
lto = true
panic = "abort"
strip = true

[dev-dependencies]
snow = { version = "0.10.0", default-features = false, features = ["use-blake2", "use-chacha20poly1305", "use-curve25519", "use-getrandom"] }
